<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ quote.title }}{% if business_name %} · {{ business_name }}{% endif %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .viewer-chrome { max-width: 48rem; margin: 0 auto; padding: 1rem 1.25rem; }
    .viewer-chrome .biz { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.5rem; }
    .viewer-body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.25rem; }
  </style>
</head>
<body>
  <div class="viewer-chrome">
    {% if business_name %}
    <p class="biz">{{ business_name }}</p>
    {% endif %}
    <div class="viewer-body">
      {{ html_content | safe }}
    </div>
  </div>
  <img src="{{ pixel_url }}" width="1" height="1" alt="" style="display:none">
  {% if marketing_url %}
  <footer class="site-footer">
    <a href="{{ marketing_url }}">Powered by OpenPing</a>
  </footer>
  {% endif %}
</body>
</html>
